name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore nzua-mcp.sln --locked-mode -p:NuGetAudit=true -p:NuGetAuditLevel=moderate
      - name: Test
        run: dotnet test nzua-mcp.sln --configuration Release --no-restore --warnaserror