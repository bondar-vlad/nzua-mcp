name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test nzua-mcp.sln

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Folder publish (без single-file): Playwright потребує .playwright поруч із бінарником.
      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish NzuaMcp.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=false
          -o publish/${{ matrix.rid }}

      - name: Archive
        run: |
          cd publish/${{ matrix.rid }}
          zip -r ../../nzua-mcp-${{ github.ref_name }}-${{ matrix.rid }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: nzua-mcp-${{ matrix.rid }}
          path: nzua-mcp-*.zip

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nzua-mcp-*.zip
          generate_release_notes: true
          # Не draft: при повторному пуші тегу оновлює наявний реліз і замінює однойменні асети.
          draft: false
